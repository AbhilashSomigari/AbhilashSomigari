name: Update Contribution Activity Graph

on:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-activity-graph
  cancel-in-progress: true

jobs:
  update-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: AbhilashSomigari
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: assets/github-activity-graph.svg
          options: bg_color=0D1117&color=A78BFA&line=7C3AED&point=C4B5FD&area=true&area_color=4C1D95&hide_border=true&custom_title=Engineering%20Contribution%20Activity

      - name: Verify generated SVG
        run: |
          test -s assets/github-activity-graph.svg
          grep -q "<svg" assets/github-activity-graph.svg

      - name: Commit activity graph
        run: |
          git config user.name "Abhilash Somigari"
          git config user.email "197832085+AbhilashSomigari@users.noreply.github.com"

          git add assets/github-activity-graph.svg

          if git diff --cached --quiet; then
            echo "No activity graph changes."
            exit 0
          fi

          git commit -m "chore: update contribution activity graph"
          git push